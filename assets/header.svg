<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img" aria-labelledby="title desc">
  <title id="title">Kevin | Full Stack Developer</title>
  <desc id="desc">Una terminal con el perfil de Kevin: interfaces, APIs y bases de datos. TypeScript, Angular y Node.js.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#141525"/><stop offset="1" stop-color="#0d1117"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#a78bfa"/><stop offset="1" stop-color="#5eead4"/></linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#a78bfa" opacity=".13"/></pattern>
  </defs>
  <style>
    .mono { font-family: Consolas, 'Courier New', monospace; }
    .cursor { animation: blink 1.4s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }
  </style>
  <rect x="1" y="1" width="998" height="318" rx="18" fill="url(#bg)" stroke="#303347"/>
  <rect x="1" y="1" width="998" height="318" rx="18" fill="url(#dots)"/>
  <path d="M24 48H976" stroke="#303347"/>
  <circle cx="28" cy="26" r="5" fill="#fb7185"/><circle cx="46" cy="26" r="5" fill="#fbbf24"/><circle cx="64" cy="26" r="5" fill="#5eead4"/>
  <text x="500" y="31" text-anchor="middle" class="mono" font-size="12" fill="#a5adc4">kevin11ts / developer.profile</text>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="42" y="96" class="mono" fill="#5eead4" font-size="14">$ whoami</text>
    <text x="38" y="167" font-size="62" font-weight="700" fill="#f0f3ff">Hola, soy Kevin<tspan fill="#a78bfa">.</tspan></text>
    <text x="42" y="207" font-size="23" fill="#c4b5fd">Desarrollador Full Stack</text>
    <text x="42" y="247" font-size="16" fill="#b1b9cf">Interfaces, APIs y bases de datos.</text>
    <text x="42" y="278" class="mono" font-size="13" fill="#8d98b2">TypeScript / Angular / Node.js</text>
  </g>
  <rect x="601" y="82" width="357" height="203" rx="12" fill="#0d1117" stroke="#303347"/>
  <path d="M617 82H942" stroke="url(#accent)" stroke-width="2"/>
  <g class="mono" font-size="15">
    <text x="623" y="117" fill="#8d98b2">// del cliente al servidor</text>
    <text x="623" y="155" fill="#c4b5fd">const <tspan fill="#f0f3ff">kevin = {</tspan></text>
    <text x="643" y="186" fill="#b1b9cf">  role: <tspan fill="#5eead4">'full stack'</tspan>,</text>
    <text x="643" y="217" fill="#b1b9cf">  stack: <tspan fill="#5eead4">'TypeScript'</tspan></text>
    <text x="623" y="248" fill="#f0f3ff">};</text>
    <rect class="cursor" x="652" y="235" width="9" height="16" fill="#5eead4"/>
  </g>
</svg>
